    /* =====================================================
       تنظیمات
       ===================================================== */

    const WHATSAPP_NUMBER = "989118031241";

    let currentCategory = "all";

    let cart =
      JSON.parse(localStorage.getItem("chadoor_cart")) || [];


    /* =====================================================
       فرمت قیمت
       ===================================================== */

    function formatPrice(price) {

      if (price === null || price === undefined) {

        return "استعلام قیمت";

      }

      return price.toLocaleString("fa-IR") + " تومان";

    }


    /* =====================================================
       فیلتر دسته‌بندی
       ===================================================== */

    function setCategory(category, button) {

      currentCategory = category;

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

          btn.classList.remove("active");

        });

      button.classList.add("active");

      applyFilters();

    }


    /* =====================================================
       جستجو و فیلتر
       ===================================================== */

    function applyFilters() {

      const searchText =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        products.filter(product => {

          const categoryMatch =
            currentCategory === "all" ||
            product.category === currentCategory;


          const searchMatch =
            product.name
              .toLowerCase()
              .includes(searchText);


          return categoryMatch && searchMatch;

        });


      renderProducts(filtered);

    }


    /* =====================================================
       نمایش محصولات
       ===================================================== */

    function renderProducts(list) {

      const container =
        document.getElementById("products");


      const count =
        document.getElementById("productsCount");


      count.innerText =
        `${list.length} محصول`;


      if (list.length === 0) {

        container.innerHTML = `
          <div class="no-result">
            محصولی با این مشخصات پیدا نشد.
          </div>
        `;

        return;

      }


      container.innerHTML =
        list.map(product => `

          <div class="product">

            <div class="product-image">

              <span
                class="badge ${product.price === null ? "custom" : ""}"
              >
                ${product.badge}
              </span>

              <img
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/600x450?text=Chadoor'"
              >

            </div>


            <div class="product-info">

              <h3>
                ${product.name}
              </h3>

              <div class="category">
                ${product.category}
              </div>

              <div class="description">
                ${product.description}
              </div>


              <div
                class="price ${product.price === null ? "inquiry" : ""}"
              >

                ${
                  product.price === null
                    ? "برای قیمت تماس بگیرید"
                    : formatPrice(product.price)
                }

              </div>


              <div class="product-buttons">

                <button
                  class="add-btn"
                  onclick="addToCart(${product.id})"
                >

                  ${
                    product.price === null
                      ? "استعلام / سفارش"
                      : "افزودن به سبد"
                  }

                </button>

              </div>

            </div>

          </div>

        `).join("");

    }


    /* =====================================================
       افزودن محصول به سبد
       ===================================================== */

    function addToCart(id) {

      const product =
        products.find(p => p.id === id);


      if (!product) return;


      const existing =
        cart.find(item => item.id === id);


      if (existing) {

        existing.quantity += 1;

      } else {

        cart.push({

          id: product.id,

          name: product.name,

          price: product.price,

          category: product.category,

          quantity: 1

        });

      }


      saveCart();

      renderCart();

      showToast(
        `"${product.name}" به سبد اضافه شد`
      );

    }


    /* =====================================================
       افزایش
       ===================================================== */

    function increaseQty(id) {

      const item =
        cart.find(item => item.id === id);


      if (!item) return;


      item.quantity += 1;

      saveCart();

      renderCart();

    }


    /* =====================================================
       کاهش
       ===================================================== */

    function decreaseQty(id) {

      const item =
        cart.find(item => item.id === id);


      if (!item) return;


      item.quantity -= 1;


      if (item.quantity <= 0) {

        cart =
          cart.filter(i => i.id !== id);

      }


      saveCart();

      renderCart();

    }


    /* =====================================================
       حذف
       ===================================================== */

    function removeFromCart(id) {

      cart =
        cart.filter(item => item.id !== id);

      saveCart();

      renderCart();

    }


    /* =====================================================
       ذخیره سبد
       ===================================================== */

    function saveCart() {

      localStorage.setItem(
        "chadoor_cart",
        JSON.stringify(cart)
      );

    }


    /* =====================================================
       نمایش سبد
       ===================================================== */

    function renderCart() {

      const container =
        document.getElementById("cart-items");


      const totalEl =
        document.getElementById("total");


      if (cart.length === 0) {

        container.innerHTML =
          `<div class="empty">
             سبد خرید خالی است
           </div>`;

        totalEl.innerText =
          "جمع کل: ۰ تومان";

        return;

      }


      container.innerHTML =
        cart.map(item => `

          <div class="cart-item">

            <div class="item-info">

              <strong>
                ${item.name}
              </strong>

              <span class="item-price">

                ${
                  item.price === null
                    ? "استعلام قیمت"
                    : formatPrice(item.price)
                }

              </span>

            </div>


            <div class="qty-controls">

              <button
                class="qty-btn"
                onclick="decreaseQty(${item.id})"
              >
                −
              </button>

              <span class="qty-number">
                ${item.quantity}
              </span>

              <button
                class="qty-btn"
                onclick="increaseQty(${item.id})"
              >
                +
              </button>

            </div>


            <button
              class="remove-btn"
              onclick="removeFromCart(${item.id})"
            >
              حذف
            </button>

          </div>

        `).join("");


      const hasUnknownPrice =
        cart.some(item => item.price === null);


      const total =
        cart.reduce(
          (sum, item) => {

            if (item.price === null) {

              return sum;

            }

            return sum +
              (item.price * item.quantity);

          },
          0
        );


      if (hasUnknownPrice) {

        totalEl.innerText =
          `جمع محصولات دارای قیمت: ${total.toLocaleString("fa-IR")} تومان`;

      } else {

        totalEl.innerText =
          `جمع کل: ${total.toLocaleString("fa-IR")} تومان`;

      }

    }


    /* =====================================================
       ثبت سفارش واتساپ
       ===================================================== */

    function checkout() {

      if (cart.length === 0) {

        alert(
          "سبد خرید خالی است!"
        );

        return;

      }


      let message =
        "سلام، از فروشگاه چادردوزی جزیره می‌خواهم سفارش ثبت کنم:\n\n";


      cart.forEach(item => {

        message +=
          `• ${item.name}\n`;

        message +=
          `  تعداد: ${item.quantity}\n`;


        if (item.price === null) {

          message +=
            `  قیمت: استعلام قیمت\n\n`;

        } else {

          const itemTotal =
            item.price * item.quantity;

          message +=
            `  قیمت: ${itemTotal.toLocaleString("fa-IR")} تومان\n\n`;

        }

      });


      const total =
        cart.reduce(
          (sum, item) => {

            if (item.price === null) {

              return sum;

            }

            return sum +
              (item.price * item.quantity);

          },
          0
        );


      message +=
        `جمع محصولات دارای قیمت: ${total.toLocaleString("fa-IR")} تومان\n\n`;

      message +=
        "لطفاً موجودی و قیمت نهایی محصولات را اعلام فرمایید.";


      const whatsappUrl =
