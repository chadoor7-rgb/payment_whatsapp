<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | چادردوزی جزیره J.A.T</title>
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .cart-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .cart-header h1 {
      font-size: 1.7rem;
      margin: 0;
    }

    .back-link {
      color: #0d9488;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* سبد خالی */
    .empty-cart {
      text-align: center;
      padding: 4rem 1rem;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px dashed #cbd5e1;
    }

    .empty-cart h2 {
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
      color: #1e293b;
    }

    .empty-cart p {
      color: #64748b;
      margin-bottom: 1.8rem;
    }

    .empty-cart a {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #0d9488;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    }

    .empty-cart a:hover {
      background: #0f766e;
    }

    /* آیتم‌های سبد */
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 1rem;
      align-items: center;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 1rem;
    }

    .cart-item img {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
    }

    .cart-item-info h3 {
      margin: 0 0 0.3rem;
      font-size: 1rem;
    }

    .cart-item-info .price {
      color: #0f766e;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .qty-control button {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f8fafc;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-control button:hover {
      background: #e2e8f0;
    }

    .item-actions {
      text-align: left;
    }

    .item-total {
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #dc2626;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0;
    }

    .remove-btn:hover {
      text-decoration: underline;
    }

    /* خلاصه سبد */
    .cart-summary {
      margin-top: 2rem;
      background: #f8fafc;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.7rem;
      font-size: 1.05rem;
    }

    .summary-row.total {
      font-size: 1.3rem;
      font-weight: 700;
      border-top: 1px solid #cbd5e1;
      padding-top: 1rem;
      margin-top: 0.8rem;
      color: #0f766e;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 1.5rem;
      padding: 1rem;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .checkout-btn:hover {
      background: #0f766e;
    }

    @media (max-width: 600px) {
      .cart-item {
        grid-template-columns: 70px 1fr;
      }
      .item-actions {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="چادردوزی جزیره J.A.T">
      <span class="brand-mark">
        <img src="favicon.svg" alt="لوگو" width="45" height="45">
      </span>
      <span>چادردوزی جزیره J.A.T</span>
    </a>

    <nav class="main-nav" aria-label="منوی اصلی">
      <a href="products.html">محصولات</a>
      <a href="shop.html">🛒 فروشگاه</a>
      <a href="services.html">خدمات ما</a>
      <a href="gallery.html">گالری</a>
      <a href="about.html">درباره J.A.T</a>
      <a href="blog.html">مجله سفر</a>
      <a href="contact.html">ثبت سفارش</a>
    </nav>

    <a class="cart-link" href="cart.html">
      🛒 سبد خرید
      <span id="cartCount">0</span>
    </a>

    <a class="header-action" href="contact.html">ثبت سفارش</a>

    <button class="menu-toggle" type="button" aria-label="باز کردن منو" aria-expanded="false">
      <i data-lucide="menu"></i>
    </button>
  </header>

  <main class="cart-page">

    <div class="cart-header">
      <h1>سبد خرید شما</h1>
      <a href="shop.html" class="back-link">← بازگشت به فروشگاه</a>
    </div>

    <!-- اینجا محتوا نمایش داده می‌شود -->
    <div id="cartContent"></div>

  </main>

  <footer>
    <div class="footer-top">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <img src="favicon.svg" alt="لوگو" width="45" height="45">
        </span>
        <span>چادردوزی جزیره J.A.T</span>
      </a>
      <p class="footer-slogan">برای هر مسیر، یک پناه مطمئن.</p>
    </div>

    <div class="copyright">
      © 2026 چادردوزی جزیره J.A.T<br>
      کلیه حقوق این وب‌سایت محفوظ است.
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    const WHATSAPP_PHONE = "989118031241";
    let cart = [];

    // خواندن سبد از localStorage
    try {
      cart = JSON.parse(localStorage.getItem("chadoor_cart")) || [];
    } catch (e) {
      cart = [];
    }

    function formatPrice(price) {
      return price.toLocaleString("fa-IR") + " تومان";
    }

    function saveCart() {
      localStorage.setItem("chadoor_cart", JSON.stringify(cart));
      updateCartCount();
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const el = document.getElementById("cartCount");
      if (el) el.innerText = count;
    }

    function changeQty(id, delta) {
      const item = cart.find(p => p.id === id);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(p => p.id !== id);
      }
      saveCart();
      renderCart();
    }

    function removeItem(id) {
      cart = cart.filter(p => p.id !== id);
      saveCart();
      renderCart();
    }

    function getTotal() {
      return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    function checkout() {
      if (cart.length === 0) return;

      let message = "سلام، می‌خواهم این محصولات را سفارش دهم:\n\n";
      cart.forEach(item => {
        message += `• ${item.name} × ${item.qty} = ${formatPrice(item.price * item.qty)}\n`;
      });
      message += `\nجمع کل: ${formatPrice(getTotal())}\n\nلطفاً راهنمایی کنید.`;

      window.open(
        `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`,
        "_blank"
      );
    }

    function renderCart() {
      const container = document.getElementById("cartContent");

      // ========== سبد خالی ==========
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <h2>سبد خرید شما خالی است</h2>
            <p>هنوز هیچ محصولی به سبد اضافه نکرده‌اید.</p>
            <a href="shop.html">مشاهده محصولات و خرید</a>
          </div>
        `;
        return;
      }

      // ========== سبد دارای محصول ==========
      let itemsHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.name}" loading="lazy">
          
          <div class="cart-item-info">
            <h3>${item.name}</h3>
            <div class="price">${formatPrice(item.price)}</div>
            <div class="qty-control">
              <button onclick="changeQty(${item.id}, -1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>

          <div class="item-actions">
            <div class="item-total">${formatPrice(item.price * item.qty)}</div>
            <button class="remove-btn" onclick="removeItem(${item.id})">حذف</button>
          </div>
        </div>
      `).join("");

      container.innerHTML = `
        <div class="cart-items">
          ${itemsHTML}
        </div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>تعداد کل اقلام:</span>
            <span>${cart.reduce((s, i) => s + i.qty, 0)} عدد</span>
          </div>
          <div class="summary-row total">
            <span>جمع کل قابل پرداخت:</span>
            <span>${formatPrice(getTotal())}</span>
          </div>

          <button class="checkout-btn" onclick="checkout()">
            📱 ثبت سفارش از طریق واتساپ
          </button>
        </div>
      `;
    }

    // اجرا هنگام لود صفحه
    renderCart();
    updateCartCount();

    if (window.lucide) {
      lucide.createIcons();
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
