 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | چادردوزی جزیره J.A.T</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .cart-page {
      max-width: 920px;
      margin: 0 auto;
      padding: 2rem 1rem 5rem;
    }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .cart-header h1 {
      font-size: 1.75rem;
      margin: 0;
      font-weight: 800;
    }
    .back-link {
      color: #0d9488;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .back-link:hover { text-decoration: underline; }

    /* Empty State */
    .empty-cart {
      text-align: center;
      padding: 4.5rem 1.5rem;
      background: #f8fafc;
      border-radius: 18px;
      border: 1.5px dashed #cbd5e1;
    }
    .empty-cart h2 {
      font-size: 1.45rem;
      margin-bottom: 0.7rem;
      color: #1e293b;
    }
    .empty-cart p {
      color: #64748b;
      margin-bottom: 1.8rem;
      font-size: 1rem;
    }
    .empty-cart a {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: #0d9488;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.2s;
    }
    .empty-cart a:hover { background: #0f766e; }

    /* Cart Items */
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 95px 1fr auto;
      gap: 1.1rem;
      align-items: center;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.1rem;
      transition: box-shadow 0.2s;
    }
    .cart-item:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }
    .cart-item img {
      width: 95px;
      height: 75px;
      object-fit: cover;
      border-radius: 12px;
      background: #f1f5f9;
    }
    .cart-item-info h3 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .cart-item-info .price {
      color: #0f766e;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.6rem;
    }
    .qty-control button {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 1.15rem;
      cursor: pointer;
      font-family: inherit;
      line-height: 1;
      transition: all 0.15s;
    }
    .qty-control button:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    .qty-control span {
      min-width: 30px;
      text-align: center;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .item-actions {
      text-align: left;
    }
    .item-total {
      font-weight: 800;
      color: #0f766e;
      margin-bottom: 0.55rem;
      font-size: 1.05rem;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      font-weight: 600;
    }
    .remove-btn:hover { text-decoration: underline; }

    /* Summary + Form */
    .cart-summary {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 1.8rem;
 margin-top: 1.5rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.9rem;
      font-size: 1.05rem;
    }
    .summary-row.total {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f766e;
      border-top: 1px solid #e2e8f0;
      padding-top: 1rem;
      margin-top: 0.8rem;
      margin-bottom: 1.8rem;
    }

    .customer-form {
      margin-top: 1.5rem;
      border-top: 1px dashed #cbd5e1;
      padding-top: 1.8rem;
    }
    .customer-form h3 {
      margin: 0 0 1.2rem;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: #334155;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
      background: #f8fafc;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #0d9488;
      background: white;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }
    .form-error {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.35rem;
      display: none;
    }
    .form-error.show { display: block; }

    .checkout-btn {
      width: 100%;
      padding: 1.05rem;
      background: #25d366;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: background 0.2s, transform 0.15s;
      margin-top: 0.5rem;
    }
    .checkout-btn:hover {
      background: #1ebe57;
      transform: translateY(-2px);
    }
    .checkout-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .cart-item {
        grid-template-columns: 80px 1fr;
        gap: 0.9rem;
      }
      .item-actions {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.4rem;
        padding-top: 0.7rem;
        border-top: 1px solid #f1f5f9;
      }
      .item-total { margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <!-- HEADER (همان هدر سایت) -->
  <header class="site-header sticky-header">
    <a href="index.html" class="brand">
      <img src="favicon.svg" alt="لوگو چادردوزی جزیره" class="brand-logo" width="44" height="44">
      <span>چادردوزی جزیره J.A.T</span>
    </a>
    <nav class="main-nav" aria-label="منوی اصلی">
      <a href="products.html">محصولات</a>
      <a href="shop.html">فروشگاه</a>
      <a href="services.html">خدمات</a>
      <a href="gallery.html">گالری</a>
      <a href="about.html">درباره ما</a>
      <a href="blog.html">مجله سفر</a>
      <a href="contact.html">ثبت سفارش</a>
    </nav>
    <div class="header-actions">
      <a class="cart-link" href="cart.html" aria-label="سبد خرید">
        🛒 <span id="cartCount">0</span>
      </a>
      <a href="contact.html" class="btn btn-primary btn-sm">ثبت سفارش</a>
    </div>
    <button class="menu-toggle" aria-label="باز کردن منو">☰</button>
  </header>

  <main>
    <div class="cart-page">
      <div class="cart-header">
        <h1>سبد خرید شما</h1>
        <a href="shop.html" class="back-link">← بازگشت به فروشگاه</a>
      </div>

      <div id="cartContent">
        <!-- محتوا با جاوااسکریپت پر می‌شود -->
      </div>
    </div>
  </main>

  <script>
  (function () {
    var WHATSAPP_PHONE = "989118031241";
    var cart = [];

    try {
      cart = JSON.parse(localStorage.getItem("chadoor_cart")) || [];
    } catch (e) {
      cart = [];
    }
 // یکسان‌سازی داده‌ها
    cart = cart.map(function (item) {
      return {
        id: String(item.id),
        name: item.name || "محصول",
        price: Number(item.price) || 0,
        image: item.image || "hero-chadoor.webp",
        qty: Number(item.qty) || 1
      };
    });

    function formatPrice(price) {
      return Number(price).toLocaleString("fa-IR") + " تومان";
    }

    function saveCart() {
      localStorage.setItem("chadoor_cart", JSON.stringify(cart));
      updateCartCount();
    }

    function updateCartCount() {
      var count = cart.reduce(function (sum, item) {
        return sum + (item.qty || 0);
      }, 0);
      var el = document.getElementById("cartCount");
      if (el) el.innerText = count;
    }

    function changeQty(id, delta) {
      id = String(id);
      var item = cart.find(function (p) { return String(p.id) === id; });
      if (!item) return;

      item.qty = (item.qty || 0) + delta;
      if (item.qty <= 0) {
        cart = cart.filter(function (p) { return String(p.id) !== id; });
      }
      saveCart();
      renderCart();
    }

    function removeItem(id) {
      id = String(id);
      cart = cart.filter(function (p) { return String(p.id) !== id; });
      saveCart();
      renderCart();
    }

    function getTotal() {
      return cart.reduce(function (sum, item) {
        return sum + (item.price * item.qty);
      }, 0);
    }

    function validateForm() {
      var name = document.getElementById("customerName").value.trim();
      var phone = document.getElementById("customerPhone").value.trim();
      var address = document.getElementById("customerAddress").value.trim();
      var isValid = true;

      // پاک کردن خطاهای قبلی
      document.querySelectorAll(".form-error").forEach(function (el) {
        el.classList.remove("show");
      });

      if (name.length < 3) {
        document.getElementById("nameError").classList.add("show");
        isValid = false;
      }

      // اعتبارسنجی شماره موبایل ایرانی
      var phoneClean = phone.replace(/\D/g, "");
      if (!/^09\d{9}\( /.test(phoneClean) && !/^9\d{9} \)/.test(phoneClean)) {
        document.getElementById("phoneError").classList.add("show");
        isValid = false;
      }

      return isValid ? { name: name, phone: phoneClean, address: address } : null;
    }

    function checkout() {
      if (cart.length === 0) return;

      var customer = validateForm();
      if (!customer) return;

      var message = "سلام، می‌خواهم این سفارش را ثبت کنم:\n\n";
      message += "👤 نام: " + customer.name + "\n";
      message += "📱 موبایل: " + customer.phone + "\n";
      if (customer.address) {
        message += "📍 آدرس: " + customer.address + "\n";
      }
      message += "\n📦 لیست سفارش:\n";
      message += "────────────────\n";

      cart.forEach(function (item) {
        message += "• " + item.name + " × " + item.qty + " = " + formatPrice(item.price * item.qty) + "\n";
      });

      message += "────────────────\n";
      message += "💰 جمع کل: " + formatPrice(getTotal()) + "\n\n";
      message += "لطفاً موجودی و زمان ارسال را اعلام کنید.";

      window.open(
        "https://wa.me/" + WHATSAPP_PHONE + "?text=" + encodeURIComponent(message),
        "_blank"
      );
    }

    function renderCart() {
      var container = document.getElementById("cartContent");
      if (!container) return;

      if (cart.length === 0) {
        container.innerHTML =
          '<div class="empty-cart">' +
            "<h2>سبد خرید شما خالی است</h2>" +
            "<p>هنوز محصولی به سبد اضافه نکرده‌اید.</p>" +
            '<a href="shop.html">مشاهده محصولات فروشگاه</a>' +
          "</div>";
        return;
      }

      var itemsHTML = "";
      for (var i = 0; i < cart.length; i++) {
        var item = cart[i];
 var img = item.image || "hero-chadoor.webp";
        itemsHTML +=
          '<div class="cart-item">' +
            '<img src="' + img + '" alt="' + item.name + '" loading="lazy" onerror="this.src=\'hero-chadoor.webp\'">' +
            '<div class="cart-item-info">' +
              "<h3>" + item.name + "</h3>" +
              '<div class="price">' + formatPrice(item.price) + "</div>" +
              '<div class="qty-control">' +
                '<button type="button" data-action="minus" data-id="' + item.id + '">−</button>' +
                "<span>" + item.qty + "</span>" +
                '<button type="button" data-action="plus" data-id="' + item.id + '">+</button>' +
              "</div>" +
            "</div>" +
            '<div class="item-actions">' +
              '<div class="item-total">' + formatPrice(item.price * item.qty) + "</div>" +
              '<button type="button" class="remove-btn" data-action="remove" data-id="' + item.id + '">حذف</button>' +
            "</div>" +
          "</div>";
      }

      var totalQty = cart.reduce(function (s, it) { return s + it.qty; }, 0);

      container.innerHTML =
        '<div class="cart-items">' + itemsHTML + "</div>" +
        '<div class="cart-summary">' +
          '<div class="summary-row">' +
            "<span>تعداد کل اقلام:</span>" +
            "<span>" + totalQty + " عدد</span>" +
          "</div>" +
          '<div class="summary-row total">' +
            "<span>جمع کل قابل پرداخت:</span>" +
            "<span>" + formatPrice(getTotal()) + "</span>" +
          "</div>" +

          // فرم اطلاعات مشتری
          '<div class="customer-form">' +
            "<h3>اطلاعات تماس برای ثبت سفارش</h3>" +
            '<div class="form-group">' +
              '<label for="customerName">نام و نام خانوادگی *</label>' +
              '<input type="text" id="customerName" placeholder="مثال: علی رضایی" autocomplete="name">' +
              '<div class="form-error" id="nameError">لطفاً نام خود را وارد کنید (حداقل ۳ حرف)</div>' +
            "</div>" +
            '<div class="form-group">' +
              '<label for="customerPhone">شماره موبایل *</label>' +
              '<input type="tel" id="customerPhone" placeholder="مثال: 09123456789" autocomplete="tel">' +
              '<div class="form-error" id="phoneError">شماره موبایل معتبر وارد کنید (مثال: 09123456789)</div>' +
            "</div>" +
            '<div class="form-group">' +
              '<label for="customerAddress">آدرس (اختیاری)</label>' +
              '<textarea id="customerAddress" placeholder="آدرس دقیق برای ارسال..."></textarea>' +
            "</div>" +
          "</div>" +

          '<button type="button" class="checkout-btn" id="checkoutBtn">📱 ثبت سفارش در واتساپ</button>' +
        "</div>";

      // اتصال رویدادها
      container.querySelectorAll("[data-action]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var action = this.getAttribute("data-action");
          var id = this.getAttribute("data-id");
          if (action === "plus") changeQty(id, 1);
          else if (action === "minus") changeQty(id, -1);
          else if (action === "remove") removeItem(id);
        });
      });

      var checkoutBtn = document.getElementById("checkoutBtn");
      if (checkoutBtn) {
        checkoutBtn.addEventListener("click", checkout);
      }
    }

    // اجرا
    renderCart();
    updateCartCount();
  })();
  </script>

</body>
</html>
