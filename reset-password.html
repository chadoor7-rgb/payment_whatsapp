
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#103f39">
  <title>تعیین رمز جدید | چادردوزی جزیره</title>

  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 15px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f5f3;
      color: #18332e;
      font-family: Estedad, Tahoma, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 35px #163d3512;
    }

    h1 {
      font-size: 21px;
      color: #103f39;
      margin-top: 0;
    }

    p {
      font-size: 13px;
      line-height: 2;
      color: #64736c;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d7dfda;
      border-radius: 9px;
      font: inherit;
      direction: ltr;
      text-align: left;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #155e55;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #e8f5ec;
      color: #176438;
    }

    .error {
      display: block !important;
      background: #fff0ee;
      color: #a12b20;
    }

    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #155e55;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>تعیین رمز عبور جدید</h1>

  <p>
    چادردوزی جزیره J.A.T
    <br>
    رمز جدید حساب مدیریت نظرات مشتریان را وارد کنید.
  </p>

  <form id="resetForm">

    <label for="password">رمز عبور جدید</label>
    <input
      id="password"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="حداقل ۸ کاراکتر"
      required
    >

    <label for="confirmPassword">تکرار رمز عبور جدید</label>
    <input
      id="confirmPassword"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="تکرار رمز عبور"
      required
    >

    <button id="submitButton" type="submit" disabled>
      در حال بررسی لینک بازیابی...
    </button>

  </form>

  <div id="message"></div>

  <a class="back" href="https://chadooor.ir/">
    بازگشت به سایت چادردوزی جزیره
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://mvvatgwuqhmujgvhwxbt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_N3ZsOvSj6MioK-rxNNxh0w_w9Fd6FEC";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );

  const form = document.getElementById("resetForm");
  const button = document.getElementById("submitButton");
  const message = document.getElementById("message");

  let recoveryReady = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  async function checkRecovery() {
    button.disabled = true;

    const { data, error } = await client.auth.getSession();

    if (error || !data.session) {
      showMessage(
        "لینک بازیابی معتبر نیست یا منقضی شده است. لطفاً دوباره درخواست بازیابی رمز بدهید.",
        "error"
      );
      button.textContent = "لینک معتبر نیست";
      return;
    }

    recoveryReady = true;
    button.disabled = false;
    button.textContent = "ذخیره رمز جدید";

    showMessage(
      "لینک بازیابی معتبر است. اکنون رمز جدید خود را وارد کنید.",
      "success"
    );
  }

  client.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
      recoveryReady = true;
      button.disabled = false;
      button.textContent = "ذخیره رمز جدید";
      showMessage(
        "لینک بازیابی تأیید شد. رمز جدید را وارد کنید.",
        "success"
      );
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!recoveryReady) return;

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password.length < 8) {
      showMessage(
        "رمز عبور باید حداقل ۸ کاراکتر باشد.",
        "error"
      );
      return;
    }

    if (password !== confirmPassword) {
      showMessage(
        "رمز عبور و تکرار آن یکسان نیستند.",
        "error"
      );
      return;
    }

    button.disabled = true;
    button.textContent = "در حال ذخیره...";

    const { error } = await client.auth.updateUser({
      password: password
    });

    if (error) {
      showMessage(
        "خطا در ذخیره رمز: " + error.message,
        "error"
      );
      button.disabled = false;
      button.textContent = "ذخیره رمز جدید";
      return;
    }

    showMessage(
      "رمز عبور با موفقیت تغییر کرد. اکنون می‌توانید وارد پنل مدیریت شوید.",
      "success"
    );

    form.reset();

    await client.auth.signOut();

    button.textContent = "رمز جدید ذخیره شد";
  });

  checkRecovery();

})();
</script>

</body>
</html>
