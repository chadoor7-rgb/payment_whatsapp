 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | چادردوزی جزیره J.A.T</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: #f7f5f0;
      color: #1a1a1a;
      line-height: 1.7;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    .top-header {
      background: #1a3c34;
      color: white;
      padding: 12px 0;
      font-size: 14px;
    }
    .top-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; }

    /* Breadcrumb */
    .breadcrumb {
      padding: 16px 0;
      font-size: 13px;
      color: #666;
    }
    .breadcrumb a { color: #1a3c34; }
    .breadcrumb span { margin: 0 6px; color: #999; }

    /* Product Main */
    .product-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 40px;
    }

    /* Gallery */
    .gallery { position: relative; }
    .main-image {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
      display: block;
    }
    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
    }
    .thumb.active, .thumb:hover { border-color: #1a3c34; }

    /* Product Info */
    .product-info h1 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .product-meta {
      display: flex;
      gap: 15px;
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .rating { color: #f5a623; font-size: 14px; }
    .price {
      font-size: 28px;
      font-weight: bold;
      color: #e74c3c;
      margin: 18px 0;
    }
    .key-features {
      background: #f8f9f7;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .key-features h3 {
      font-size: 15px;
      margin-bottom: 10px;
      color: #1a3c34;
    }
    .key-features ul { list-style: none; }
    .key-features li {
      font-size: 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .key-features li::before {
      content: "✓";
      color: #1a3c34;
      font-weight: bold;
    }

    /* Options */
    .options { margin-bottom: 20px; }
    .option-group { margin-bottom: 14px; }
    .option-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .color-options, .size-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #ddd;
      cursor: pointer;
    }
    .color-btn.active {
      border-color: #1a3c34;
      box-shadow: 0 0 0 2px white, 0 0 0 4px #1a3c34;
    }
    .size-btn {
      padding: 8px 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .size-btn.active, .size-btn:hover {
      background: #1a3c34;
      color: white;
      border-color: #1a3c34;
    }
 /* Buttons */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    .btn-primary {
      background: #1a3c34;
      color: white;
    }
    .btn-primary:hover { background: #14302a; }
    .btn-whatsapp {
      background: #25d366;
      color: white;
    }
    .btn-whatsapp:hover { background: #1ebe57; }

    /* Details */
    .product-details {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 40px;
    }
    .section-title {
      font-size: 18px;
      margin-bottom: 20px;
      color: #1a3c34;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    .specs-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .specs-table td:first-child {
      width: 40%;
      color: #666;
      background: #fafafa;
    }
    .description {
      font-size: 15px;
      color: #333;
      line-height: 1.9;
    }

    /* Related */
    .related { margin-bottom: 60px; }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .related-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      transition: 0.2s;
    }
    .related-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .related-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    .related-card .info { padding: 14px; }
    .related-card h4 { font-size: 14px; margin-bottom: 6px; }
    .related-card .price {
      font-size: 15px;
      color: #e74c3c;
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .product-main {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 20px;
      }
      .main-image { height: 320px; }
    }
    @media (max-width: 600px) {
      .main-image { height: 260px; }
      .product-info h1 { font-size: 22px; }
      .price { font-size: 24px; }
    }
  </style>
</head>

    // ===================== بارگذاری محصول =====================
    function getProductId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || '1';
    }

    function loadProduct() {
      const id = getProductId();
      const p = products[id];

      if (!p) {
        document.getElementById('product-main').innerHTML = '<p style="padding:40px;text-align:center">محصول مورد نظر پیدا نشد.</p>';
        return;
      }

      // Breadcrumb
      document.getElementById('breadcrumb-name').textContent = p.name;
      document.title = p.name + ' | چادردوزی جزیره J.A.T';

      // Main section
      let thumbsHtml = p.thumbs.map((src, i) => 
        <img src="${src}" class="thumb \( {i===0?'active':''}" onclick="changeImage(this, ' \){p.mainImage}')">
      ).join('');

      document.getElementById('product-main').innerHTML = 
        <div class="gallery">
          <img src="\( {p.mainImage}" alt=" \){p.name}" class="main-image" id="mainImage">
          <div class="thumbnails">${thumbsHtml}</div>
        </div>
        <div class="product-info">
          <h1>${p.name}</h1>
          <div class="product-meta">
            <span>کد محصول: ${p.code}</span>
            <span class="rating">${p.rating}</span>
          </div>
          <div class="price">${p.price}</div>
          <div class="key-features">
            <h3>ویژگی‌های کلیدی</h3>
            <ul>
              \( {p.features.map(f => <li> \){f}</li>`).join('')}
            </ul>
          </div>
          <div class="options">
            <div class="option-group">
              <label>رنگ</label>
              <div class="color-options">
<div class="color-btn active" style="background:#1e5f8a" title="آبی"></div>
                <div class="color-btn" style="background:#4a7c59" title="سبز"></div>
                <div class="color-btn" style="background:#555" title="خاکستری"></div>
              </div>
            </div>
            <div class="option-group">
              <label>سایز</label>
              <div class="size-options">
                <button class="size-btn active">استاندارد</button>
              </div>
            </div>
          </div>
          <div class="action-buttons">
            <button class="btn btn-primary" onclick="alert('برای ثبت سفارش با ما تماس بگیرید')">🛒 ثبت سفارش</button>
            <a href="https://wa.me/989118031241?text=${encodeURIComponent(p.whatsapp)}" 
               class="btn btn-whatsapp" target="_blank">
              💬 سفارش در واتساپ
            </a>
          </div>
        </div>
      ;

      // Specs & Description
      let specsHtml = p.specs.map(row => 
        <tr><td>\( {row[0]}</td><td> \){row[1]}</td></tr>
      ).join('');

      document.getElementById('product-details').innerHTML = 
        <h2 class="section-title">📋 مشخصات کامل</h2>
        <table class="specs-table">${specsHtml}</table>
        <h2 class="section-title">📝 توضیحات محصول</h2>
        <div class="description"><p>${p.description}</p></div>
      ;

      // Related products
      let relatedHtml = '';
      Object.keys(products).forEach(key => {
        if (key !== id) {
          const r = products[key];
          relatedHtml += 
            <a href="product.html?id=${key}" class="related-card">
              <img src="\( {r.mainImage}" alt=" \){r.name}">
              <div class="info">
                <h4>${r.name}</h4>
                <div class="price">${r.price}</div>
              </div>
            </a>
          `;
        }
      });
      document.getElementById('related-grid').innerHTML = relatedHtml;

      // Color & size buttons
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
        });
      });
    }

    function changeImage(el, mainSrc) {
      // اگر عکس واقعی داشتی اینجا تغییر بده
      document.getElementById('mainImage').src = el.src.replace('80x80', '600x420');
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    // اجرا
    loadProduct();
  </script>
</body>
