    * {

    body {

    a {

    }

    /* هدر */
    .header {
      background: #fff;
      border-bottom: 1px solid #e5e8e5;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      color: #0d5c4d;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav {
      display: flex;
      gap: 22px;
      font-size: 14.5px;
    }

    .nav a:hover {
      color: #0d5c4d;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-buttons .btn,
    .repair .btn,
    .final-cta .btn {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14.5px;
      transition: 0.25s;
      border: none;
      cursor: pointer;
    }

    .hero-buttons .btn-primary,
    .repair .btn-primary {
      background: #0d5c4d;
      color: #fff;
    }

    .hero-buttons .btn-primary:hover,
    .repair .btn-primary:hover {
      background: #094438;
    }

    .hero-buttons .btn-secondary {
      background: #fff;
      color: #0d5c4d;
      border: 2px solid #0d5c4d;
    }

    /* هیرو */
    .hero {
      max-width: 1200px;
      margin: 50px auto 40px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 50px;
    }

    .hero-content {
      flex: 1;
    }

    .hero-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 13.5px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 36px;
      line-height: 1.35;
      margin-bottom: 16px;
    }

    .hero h1 span {
      color: #0d5c4d;
    }

    .hero p {
      font-size: 16px;
      color: #555;
      margin-bottom: 28px;
      max-width: 480px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-image {
      flex: 1;
      max-width: 460px;
    }

    .hero-image img {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    /* نوار اعتماد */
    .trust {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 22px 15px;
      background: #fff;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px;
    }

    .trust-item strong {
      display: block;
      font-size: 14px;
    }

    .trust-item span {
      font-size: 12.5px;
      color: #666;
    }

    /* دسته‌بندی */
    .section {
      max-width: 1100px;
      margin: 0 auto 70px;
      padding: 0 20px;
    }

    .section-title {
      text-align: center;
      font-size: 26px;
      margin-bottom: 35px;
    }

    .cats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .cat-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px 18px;
      text-align: center;
      transition: 0.3s;
    }
 .cat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      border-color: #0d5c4d;
    }

    .cat-card .icon {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .cat-card h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .cat-card p {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 14px;
    }

    .cat-card .link {
      font-size: 13.5px;
      color: #0d5c4d;
      font-weight: 600;
    }

    /* تعمیر */
    .repair {
      background: #eef7f4;
      border-radius: 16px;
      padding: 45px 30px;
      text-align: center;
      margin-bottom: 70px;
    }

    .repair h2 {
      font-size: 26px;
      margin-bottom: 14px;
    }

    .repair p {
      max-width: 580px;
      margin: 0 auto 25px;
      color: #555;
    }

    /* نظرات */
    .testimonials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .testimonial {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid #e5e7eb;
    }

    .stars {
      color: #f5a623;
      margin-bottom: 10px;
    }

    .testimonial p {
      font-size: 14.5px;
      color: #444;
      margin-bottom: 14px;
    }

    .testimonial .author {
      font-size: 13.5px;
      font-weight: 600;
    }

    /* CTA نهایی */
    .final-cta {
      background: #0d5c4d;
      color: #fff;
      text-align: center;
      padding: 55px 20px;
      margin-top: 30px;
    }

    .final-cta h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .final-cta p {
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .final-cta .btn {
      background: #fff;
      color: #0d5c4d;
      padding: 14px 36px;
      font-size: 16px;
    }

    .final-cta .note {
      margin-top: 14px;
      font-size: 13.5px;
      opacity: 0.85;
    }

    /* فوتر */
    .footer {
      background: #fff;
      border-top: 1px solid #e5e8e5;
      padding: 40px 20px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .footer a {
      color: #0d5c4d;
    }

    /* موبایل */
    @media (max-width: 900px) {
      .hero {
        flex-direction: column-reverse;
        text-align: center;
        gap: 30px;
      }
      .hero h1 { font-size: 28px; }
      .hero-buttons { justify-content: center; }
      .trust { grid-template-columns: repeat(2, 1fr); }
      .cats-grid { grid-template-columns: repeat(2, 1fr); }
      .testimonials { grid-template-columns: 1fr; }
    }

    @media (max-width: 550px) {
      .cats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
